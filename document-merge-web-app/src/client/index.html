<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusionar Archivos a PDF</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <p class="tag">PDF MAKER</p>
            <h1>Une tus archivos en un solo PDF</h1>
            <p class="subtitle">Sube PDF, JPG, PNG, WEBP, GIF, DOC, DOCX o TXT y descarga un unico archivo final.</p>

            <form id="uploadForm" class="upload-form" novalidate>
                <label for="fileInput" class="file-label">Seleccionar archivos</label>
                <input type="file" id="fileInput" name="files" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp,.gif">

                <div id="dropZone" class="drop-zone">
                    Arrastra y suelta archivos aqui
                </div>

                <p class="small-hint">Puedes cambiar el orden arrastrando cada archivo en la lista.</p>

                <ul id="fileList" class="file-list"></ul>

                <button id="mergeButton" type="submit">Unir y Descargar PDF</button>
            </form>

            <p id="message" class="message" aria-live="polite"></p>
            <p class="credit">hecho por ENDIKA PRADERA</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
